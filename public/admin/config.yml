# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms@0.239.1/schema/sveltia-cms.json

backend:
  name: github
  repo: Mast-Strategy/astro-stack
  branch: main
  # Sveltia CMS Authenticator (separate Worker) that handles the GitHub OAuth exchange.
  base_url: https://sveltia-cms-auth.square-shadow-cb0d.workers.dev

# Default upload folder (e.g. images placed inside rich text). Served as is, not optimized.
media_folder: public/images
public_folder: /images

output:
  # Astro's Zod schemas reject empty optional values, so drop them from the files.
  omit_empty_optional_fields: true

collections:
  # Each "files" entry is one content file. Field names must match src/content.config.ts.
  - name: pages
    label: Pages
    files:
      - name: home
        label: Home page
        file: src/content/pages/home.md
        fields:
          - { name: title, label: Page name }
          - { name: description, label: Search engine description, widget: text, required: false }
          - { name: heading, label: Heading, required: false }
          # Saved next to the page in src/content/pages/images so Astro optimizes it at build time.
          - { name: image, label: Image, widget: image, required: false, media_folder: images, public_folder: images }
          - { name: image_alt, label: Image description (for screen readers), required: false }
          - { name: body, label: Body text, widget: richtext }
      - name: not-found
        label: Page not found (404)
        file: src/content/pages/not-found.md
        fields:
          - { name: title, label: Heading }
          - { name: description, label: Search engine description, widget: text, required: false }
          - { name: body, label: Message, widget: richtext }
          - { name: link_label, label: Home link text, required: false }

  - name: settings
    label: Site settings
    files:
      - name: site
        label: Site details
        file: src/content/settings/site.yml
        fields:
          - { name: site_name, label: Site name }
          - { name: email, label: Email, required: false }
          - { name: footer_text, label: Footer text, widget: text, required: false }
